spring:
  application:
    name: route-planner-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/route_planner}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Europe/Istanbul

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

# Google Maps API Key - ZORUNLU environment variable
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

logging:
  level:
    com.routeplanner: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN